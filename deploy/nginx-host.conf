# /etc/nginx/sites-available/nasa.azzu.tech (nginx del host, compartido con azzu.tech y keycloak).
# Activar: ln -s ../sites-available/nasa.azzu.tech /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Luego: certbot --nginx -d nasa.azzu.tech  (añade el bloque 443 y la redirección de 80 a 443).
server {
    listen 80;
    listen [::]:80;
    server_name nasa.azzu.tech;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
