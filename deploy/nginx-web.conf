# nginx del contenedor «web» (red del host): solo escucha en localhost; el nginx del host pone TLS delante.
server {
    listen 127.0.0.1:8080;
    root /usr/share/nginx/html;

    # Solo el contrato del frontend sale a internet; el resto de rutas de la API queda interno.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /atlas/ {
        try_files $uri $uri/ /atlas/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location ~ ^/(atlas/)?assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
