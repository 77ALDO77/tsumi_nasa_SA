<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análogos terrestres de la Luna</title>
<!-- shortcut: Leaflet y teselas OSM desde internet; para una demo sin red, servir copias locales. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: 1fr 420px; height: 100vh; }
  #mapa { height: 100vh; }
  aside { overflow-y: auto; padding: 1rem; border-left: 1px solid #ccc; }
  h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
  .aviso { background: #fff4d6; border: 1px solid #e0c060; padding: .5rem; font-size: .85rem; }
  .ficha { border: 1px solid #ccc; border-radius: 6px; padding: .6rem; margin: .6rem 0; cursor: pointer; }
  .ficha:focus, .ficha.activa { outline: 3px solid #1f5fbf; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  td, th { border-bottom: 1px solid #eee; padding: 2px 4px; text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  .meta { color: #555; font-size: .8rem; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; } #mapa { height: 50vh; } }
</style>
</head>
<body>
<div id="mapa" role="region" aria-label="Mapa de sitios terrestres"></div>
<aside>
  <h1>¿Qué lugares de la Tierra se parecen a la Luna?</h1>
  <label for="referencia">Región de referencia:</label>
  <select id="referencia"></select>
  <label for="escala">Escala:</label>
  <select id="escala"><option value="60">60 m</option><option value="120">120 m</option></select>
  <p class="aviso" id="aviso"></p>
  <div id="lista" aria-live="polite"></div>
  <h2 style="font-size:1rem">Dónde se rompe la analogía</h2>
  <ul id="limites"></ul>
</aside>
<script>
const mapa = L.map("mapa").setView([30, -100], 3);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 14, attribution: "© OpenStreetMap" }).addTo(mapa);
const capa = L.layerGroup().addTo(mapa);
const $ = (id) => document.getElementById(id);

function el(tag, text, cls) {  // textContent: los datos de la base nunca se interpretan como HTML
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}

async function cargarReferencias() {
  const { ventanas } = await api("/ventanas?cuerpo=luna");
  for (const v of ventanas) $("referencia").append(new Option(v.sitio_id, v.sitio_id));
  $("referencia").value = ventanas.some(v => v.sitio_id === "LUN-MONS-MOUTON-PLATEAU") ? "LUN-MONS-MOUTON-PLATEAU" : ventanas[0]?.sitio_id;
}

async function mostrar() {
  const res = $("escala").value, ref = $("referencia").value;
  const [geo, comp] = await Promise.all([api(`/mapa/tierra?res_m=${res}`), api(`/comparacion/${encodeURIComponent(ref)}?res_m=${res}`)]);
  $("aviso").textContent = `${comp.descargo} Los sitios no están ordenados: ${comp.orden.split(": ")[1]}.`;
  $("limites").replaceChildren(...comp.limites.map(t => el("li", t)));
  capa.clearLayers();
  const formas = {};
  L.geoJSON(geo, {
    style: { color: "#1f5fbf", weight: 2, fillOpacity: 0.15 },
    onEachFeature: (f, layer) => { formas[f.properties.sitio_id] = layer; layer.bindTooltip(f.properties.sitio_id); },
  }).addTo(capa);
  // La ventana de 15 km no se ve a escala continental: un marcador en su centro la hace visible.
  for (const f of geo.features) {
    const p = f.properties;
    L.circleMarker([p.lat, p.lon], { radius: 6, color: "#1f5fbf" }).bindTooltip(p.sitio_id)
      .on("click", () => mapa.fitBounds(formas[p.sitio_id].getBounds(), { maxZoom: 11 })).addTo(capa);
  }
  $("lista").replaceChildren(...comp.candidatos.map(c => {
    const ficha = el("div", undefined, "ficha");
    ficha.tabIndex = 0;
    ficha.append(el("strong", c.sitio_id), el("p", c.descripcion), tabla(c, ref),
                 el("p", `Coordenadas: ${c.fuente_coordenadas}`, "meta"));
    const enfocar = () => {
      document.querySelectorAll(".ficha.activa").forEach(n => n.classList.remove("activa"));
      ficha.classList.add("activa");
      if (formas[c.sitio_id]) mapa.fitBounds(formas[c.sitio_id].getBounds(), { maxZoom: 11 });
    };
    ficha.addEventListener("click", enfocar);
    ficha.addEventListener("keydown", e => { if (e.key === "Enter") enfocar(); });
    return ficha;
  }));
  if (geo.features.length) mapa.fitBounds(L.geoJSON(geo).getBounds(), { padding: [20, 20] });
}

function tabla(c, ref) {
  const t = el("table"), head = t.insertRow();
  for (const h of ["Variable", "Tierra", ref, "Diferencia"]) head.append(el("th", h));
  for (const v of c.variables) {
    const row = t.insertRow();
    const fmt = x => x === undefined ? "sin dato"
      : x.toLocaleString("es", { maximumFractionDigits: 1 }) + (v.unidad === "°" ? "°" : ` ${v.unidad}`);
    row.append(el("td", v.nombre), el("td", fmt(v.tierra)), el("td", fmt(v.referencia)), el("td", fmt(v.diferencia)));
  }
  return t;
}

$("referencia").addEventListener("change", mostrar);
$("escala").addEventListener("change", mostrar);
cargarReferencias().then(mostrar).catch(e => { $("aviso").textContent = `No se pudieron cargar los datos (${e.message}).`; });
</script>
</body>
</html>
